[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reliability-agent"
version = "0.1.0"
description = "Autonomous reliability agent for Physical AI perception pipelines: detect, diagnose with NVIDIA Nemotron on Nebius Token Factory, act safely, verify, roll back."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Aibo Ni" }]
keywords = ["physical-ai", "computer-vision", "nemotron", "nebius", "self-healing", "mape-k"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "openai>=1.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
ra-demo = "reliability_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reliability_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "scripts"]
markers = [
  "live: requires a real NEBIUS_API_KEY and network (skipped by default)",
  "slow: long-running tests",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["reliability_agent"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]
"benchmarks/**" = ["S"]
