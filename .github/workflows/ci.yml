name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,api]"
      - run: ruff check .
      - name: pytest (no network, no credits)
        run: pytest --cov --cov-report=term-missing:skip-covered
      - name: capture package coverage (Gate F2 target >= 80% lines)
        run: pytest tests/unit/test_capture.py tests/integration/test_source_contract.py --cov=reliability_agent.capture --cov-report=term
      - name: probe latency (Gate F3)
        run: python scripts/bench_probes.py

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # CLI via the official image: the gitleaks-action fails on the first push of a branch
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest
          git /repo --redact --verbose --exit-code 1
